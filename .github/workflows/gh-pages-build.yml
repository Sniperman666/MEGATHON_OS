name: GH Pages Build (gh-pages branch)

on:
  push:
    branches:
      - gh-pages

jobs:
  build-gh-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build site bundle
        run: npm run build

      - name: Upload gh-pages dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: gh-pages-dist
          path: dist
